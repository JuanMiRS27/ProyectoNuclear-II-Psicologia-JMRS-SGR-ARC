[project]
name = "simulador-psicologia-social-backend"
version = "0.1.0"
description = "Backend del Simulador de Psicología Social (monolito modular con FastAPI)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_also = ["\\.\\.\\.$", "if __name__ == .__main__.:"]
