services:
  db:
    image: postgres:16-alpine
    container_name: simulador_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALAR_DEV: "true"
    container_name: simulador_backend
    env_file: .env
    environment:
      CORREO_MODO: ${CORREO_MODO:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PUERTO: ${SMTP_PUERTO:-1025}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Servidor SMTP de desarrollo: atrapa los correos y los muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: simulador_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  datos_postgres:
